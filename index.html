<style>
*{box-sizing:border-box} body{margin:0;background:#f2f5f7;color:#14212b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#173b4d;color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}

.teacher{font-size:13px;color:#68747d;margin-top:4px}
.empty{color:#9ba3a8}
.today{outline:2px solid #6a9bb0}
.info{font-size:12px;color:#68747d;text-align:center;padding:10px}
@media(max-width:390px){.lesson{grid-template-columns:75px 1fr;padding:12px 11px}.subject{font-size:15px}}

ΙΑ"], ["12:10–12:55", "—", "—"], ["12:55–13:40", "Νεοελληνική Λογοτεχνία", "ΠΑΠΠΑ ΝΕΚΤΑΡΙΑ"], ["13:55–14:40", "Dual Diploma", "ΛΑΜΠΡΙΝΟΥ ΕΙΡΗΝΗ"], ["14:40–15:25", "Γεωλογία–Γεωγραφία", "ΓΕΩΡΓΟΠΟΥΛΟΥ ΕΛΕΝΗ"]]};

const greekDays=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
let selected=new Date().getDay();
if(selected===0||selected===6) selected=1;
selected-=1;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){ 
 const nav=document.getElementById('days'); nav.innerHTML='';
 names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.className=i===selected?'active':'';b.onclick=()=>{selected=i;render()};nav.appendChild(b)});
 const day=names[selected]; const rows=schedule[day];
 document.getElementById('app').innerHTML='<section class="card"><h2>'+day+'</h2>'+rows.map(r=>'<div class="lesson"><div class="time">'+esc(r[0])+'</div><div><div class="subject '+(r[1]==='—'?'empty':'')+'">'+esc(r[1])+'</div><div class="teacher '+(r[2]==='—'?'empty':'')+'">'+esc(r[2])+'</div></div></div>').join('')+'</section><div class="info">Γυμνάσιο Ελληνοαγγλική Αγωγή · Όμορφοκλησίας 21, Μαρούσι</div>';
}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
